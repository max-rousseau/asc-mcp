[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asc-feedback-mcp"
version = "0.1.0"
description = "MCP server exposing App Store Connect TestFlight beta feedback (screenshots, crashes, crash logs) as tools."
readme = "README.md"
license = {text = "BSD-3-Clause"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12"
dependencies = [
    "mcp~=1.28",
    "httpx~=0.28",
    "pyjwt[crypto]~=2.13",
    "cryptography~=49.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "pytest-cov~=7.1",
    "pytest-mock~=3.15",
    "pytest-timeout~=2.4",
    "black~=26.5",
    "flake8~=7.3",
    "flake8-pyproject~=1.2",
    "bandit[toml]~=1.9",
    "vulture~=2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asc_feedback_mcp"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [".venv", ".git", "__pycache__", "build", "dist"]
per-file-ignores = [
    "__init__.py:F401",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]

[tool.vulture]
exclude = [".venv/", "tests/"]
min_confidence = 80

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
timeout = 30
timeout_method = "thread"
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=src/asc_feedback_mcp",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.coverage.run]
source = ["src/asc_feedback_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
