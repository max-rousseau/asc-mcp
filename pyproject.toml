[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asc-feedback-mcp"
version = "0.1.0"
description = "MCP server exposing App Store Connect TestFlight beta feedback (screenshots, crashes, crash logs) as tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.1",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.13.0",
    "cryptography>=44.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asc_feedback_mcp"]
